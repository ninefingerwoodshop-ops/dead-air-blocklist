name: Build scam list

on:
  schedule:
    # Every 3 hours. Most runs fetch nothing (yesterday is already in) and
    # commit nothing; the extra runs let the first 30-day backfill finish in
    # about a day within the free API key's hourly limit.
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest -v test_build_blocklist

      - name: Collect FTC data and build the list
        env:
          FTC_API_KEY: ${{ secrets.FTC_API_KEY }}
        run: |
          set -o pipefail
          python build_blocklist.py --out . | tee build.log
          { echo '### Scam list'; echo '```'; cat build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$(tr '\n' ' ' < build.log)"

      - name: Publish if changed
        run: |
          if [ -z "$(git status --porcelain -- blocklist.bin manifest.json daily)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "dead-air-bot"
          git config user.email "dead-air-bot@users.noreply.github.com"
          git add -A blocklist.bin manifest.json daily
          git commit -m "Scam list $(date -u +%F)"
          git push
