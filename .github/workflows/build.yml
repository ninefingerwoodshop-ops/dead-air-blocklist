name: Build scam list

on:
  schedule:
    # Mondays 16:37 UTC — after the FTC posts Monday's file (weekend data) by noon ET.
    - cron: "37 16 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest -v test_build_blocklist

      - name: Build from the last 30 days of FTC data
        run: |
          set -o pipefail
          python build_blocklist.py --out . | tee build.log
          { echo '### Scam list'; echo '```'; cat build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$(tr '\n' ' ' < build.log)"

      - name: Publish if changed
        run: |
          if git diff --quiet -- blocklist.bin manifest.json && \
             [ -z "$(git ls-files --others --exclude-standard -- blocklist.bin manifest.json)" ]; then
            echo "List unchanged."
            exit 0
          fi
          git config user.name "dead-air-bot"
          git config user.email "dead-air-bot@users.noreply.github.com"
          git add blocklist.bin manifest.json
          git commit -m "Scam list $(date -u +%F)"
          git push
